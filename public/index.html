<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>mailab</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M1 9h3l2-6 3 10 2-4h4' fill='none' stroke='%2337e2a0' stroke-width='1.6'/></svg>">
	<link rel="stylesheet" href="/build/app.css">
</head>
<body>
	<header class="bar">
		<div class="brand"><span class="m">m</span><span class="ai">ai</span>lab</div>
		<span id="conn" class="conn" title="connection"></span>
		<div class="spacer"></div>
		<span class="mcp" title="Point your AI at this MCP endpoint">MCP <code id="mcp-url"></code></span>
		<button id="add-device">+ device</button>
		<button id="add-pane">+ pane</button>
		<button id="theme" title="toggle theme">◐</button>
	</header>
	<main class="grid-stack" id="grid"></main>

	<dialog id="dialog">
		<form method="dialog" id="dialog-form">
			<h3 id="dialog-title"></h3>
			<div id="dialog-body"></div>
			<p class="error" id="dialog-error"></p>
			<div class="actions">
				<button value="cancel" formnovalidate>cancel</button>
				<button value="ok" class="primary" id="dialog-ok">ok</button>
			</div>
		</form>
	</dialog>

	<script type="module" src="/build/app.js"></script>
</body>
</html>
